name: Memory Safety

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  valgrind:
    name: Valgrind
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            meson ninja-build pkg-config \
            libgtk-4-dev libadwaita-1-dev \
            libglib2.0-dev libsqlite3-dev libsodium-dev \
            libqpdf-dev libarchive-dev \
            gcc g++ valgrind

      - name: Configure
        run: |
          meson setup build-valgrind \
            -Dbuildtype=debug \
            -Dbuild_tests=true \
            -Dvalgrind=true

      - name: Build
        run: meson compile -C build-valgrind

      - name: Run Valgrind tests
        run: |
          meson test -C build-valgrind \
            --suite valgrind \
            --print-errorlogs \
            --timeout-multiplier 10

      - name: Upload Valgrind logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: valgrind-logs
          path: |
            build-valgrind/meson-logs/testlog.txt
            build-valgrind/**/*.log

  asan:
    name: ASan + UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            meson ninja-build pkg-config \
            libgtk-4-dev libadwaita-1-dev \
            libglib2.0-dev libsqlite3-dev libsodium-dev \
            libqpdf-dev libarchive-dev \
            gcc g++ clang

      - name: Configure with Clang (better ASan)
        env:
          CC: clang
          CXX: clang++
        run: |
          meson setup build-asan \
            -Dsanitize=address,undefined \
            -Dbuildtype=debug \
            -Dbuild_tests=true

      - name: Build
        run: meson compile -C build-asan

      - name: Run sanitized tests
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:print_stacktrace=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          meson test -C build-asan \
            --print-errorlogs \
            --timeout-multiplier 3

      - name: Upload ASan logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: asan-logs
          path: build-asan/meson-logs/testlog.txt
